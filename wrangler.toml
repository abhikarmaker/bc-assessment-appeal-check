#   wrangler kv namespace create LEADS
#   wrangler kv namespace create LEADS --preview
# then paste the resulting ids below.
[[kv_namespaces]]
binding = "LEADS"
id = "7574ea46e83345758997c06cd4d17c70"
preview_id = "efa9b29a5bbb4960a51d7d47848ff610"

# ADMIN_TOKEN is a secret, not a var — set it with:
#   wrangler pages secret put ADMIN_TOKEN
# Do not add it here in plaintext.
